{% extends "layout.html" %}

{% block content %}
<div class="header">
    <h1>Add New Asset</h1>
    <a href="/" class="btn btn-outline">← Back</a>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST" action="/add_asset" style="display: flex; flex-direction: column; gap: 1rem;">

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="asset_name" style="font-weight: 500;">Asset Name</label>
            <input type="text" id="asset_name" name="asset_name" required
                   placeholder="e.g., Production Database Server"
                   style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-color); color: var(--text-main);">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="ip_address" style="font-weight: 500;">IP Address</label>
            <input type="text" id="ip_address" name="ip_address" required
                   placeholder="e.g., 10.0.1.60"
                   value="127.0.0.1"
                   style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-color); color: var(--text-main);">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="asset_type" style="font-weight: 500;">Asset Type</label>
            <select id="asset_type" name="asset_type" required
                    style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-color); color: var(--text-main);">
                <option value="" disabled selected>Select Category...</option>
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="owner" style="font-weight: 500;">Owner (Person or Department)</label>
            <input type="text" id="owner" name="owner" required
                   placeholder="e.g., Cloud Infrastructure Team"
                   style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-color); color: var(--text-main);">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="business_criticality" style="font-weight: 500;">Business Criticality (1-5)</label>
            <select id="business_criticality" name="business_criticality" required
                    style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-color); color: var(--text-main);">
                <option value="5">5 - Critical</option>
                <option value="4">4 - High</option>
                <option value="3">3 - Medium</option>
                <option value="2">2 - Low</option>
                <option value="1">1 - Minimal</option>
            </select>
        </div>

        <button type="submit" class="btn" style="margin-top: 1rem; padding: 1rem; font-size: 1rem;">Save Asset</button>
    </form>
</div>
{% endblock %}
